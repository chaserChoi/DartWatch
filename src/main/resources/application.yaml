spring:
  application:
    name: dartwatch
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dartwatch}
    username: ${DB_USERNAME:dartwatch}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    test-connection: false
    properties:
      "[mail.smtp.auth]": ${MAIL_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS_ENABLED:true}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS_REQUIRED:true}
      "[mail.smtp.connectiontimeout]": ${MAIL_CONNECT_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${MAIL_READ_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${MAIL_WRITE_TIMEOUT_MS:5000}
      "[mail.smtp.sendpartial]": false
      "[mail.debug]": false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

dartwatch:
  notification:
    enabled: ${NOTIFICATION_ENABLED:false}
    email-to: ${NOTIFICATION_EMAIL_TO:}
    mail-from: ${MAIL_FROM:}
    max-retries: ${NOTIFICATION_MAX_RETRIES:3}
    retry-interval: ${NOTIFICATION_RETRY_INTERVAL:PT10M}
    processing-timeout: ${NOTIFICATION_PROCESSING_TIMEOUT:PT10M}
    batch-size: ${NOTIFICATION_BATCH_SIZE:20}
  classification:
    batch-size: ${CLASSIFICATION_BATCH_SIZE:100}
    window-days: ${CLASSIFICATION_WINDOW_DAYS:30}
    retry-interval: ${CLASSIFICATION_RETRY_INTERVAL:PT24H}
  opendart:
    api-key: ${OPENDART_API_KEY:}
    connect-timeout: ${OPENDART_CONNECT_TIMEOUT:5s}
    read-timeout: ${OPENDART_READ_TIMEOUT:30s}
    page-size: ${OPENDART_PAGE_SIZE:100}
    max-pages: ${OPENDART_MAX_PAGES:1000}
  collection:
    enabled: ${COLLECTION_ENABLED:false}
    interval: ${COLLECTION_INTERVAL:PT10M}
    initial-delay: ${COLLECTION_INITIAL_DELAY:PT30S}
    initial-days: ${COLLECTION_INITIAL_DAYS:30}
    overlap-days: ${COLLECTION_OVERLAP_DAYS:3}

# OpenDART authenticates in the query string; never enable request URI logging.
logging:
  level:
    org.springframework.web.client: OFF
    org.springframework.mail: OFF
    org.eclipse.angus.mail: OFF
