spring:
  application:
    name: dartwatch
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dartwatch}
    username: ${DB_USERNAME:dartwatch}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    test-connection: false
    properties:
      "[mail.smtp.auth]": ${MAIL_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS_ENABLED:true}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS_REQUIRED:true}
      "[mail.smtp.connectiontimeout]": ${MAIL_CONNECT_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${MAIL_READ_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${MAIL_WRITE_TIMEOUT_MS:5000}
      "[mail.smtp.sendpartial]": false
      "[mail.debug]": false

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: none
  tomcat:
    accesslog:
      enabled: false
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
  port: ${SERVER_PORT:8080}

springdoc:
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html

dartwatch:
  kakao:
    enabled: ${KAKAO_ENABLED:false}
    local-connect-enabled: ${KAKAO_LOCAL_CONNECT_ENABLED:false}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/integrations/kakao/callback}
    encryption-key: ${KAKAO_TOKEN_ENCRYPTION_KEY:}
    registered-web-origin: ${KAKAO_REGISTERED_WEB_ORIGIN:}
    message-web-url: ${KAKAO_MESSAGE_WEB_URL:}
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${KAKAO_READ_TIMEOUT:PT10S}
  discord:
    enabled: ${DISCORD_ENABLED:false}
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    connect-timeout: ${DISCORD_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${DISCORD_READ_TIMEOUT:PT10S}
  notification:
    scheduler:
      enabled: ${NOTIFICATION_SCHEDULER_ENABLED:false}
      interval: ${NOTIFICATION_SCHEDULER_INTERVAL:PT1M}
      initial-delay: ${NOTIFICATION_SCHEDULER_INITIAL_DELAY:PT30S}
    enabled: ${NOTIFICATION_ENABLED:false}
    email-enabled: ${EMAIL_ENABLED:true}
    email-to: ${NOTIFICATION_EMAIL_TO:}
    mail-from: ${MAIL_FROM:}
    max-retries: ${NOTIFICATION_MAX_RETRIES:3}
    retry-interval: ${NOTIFICATION_RETRY_INTERVAL:PT10M}
    processing-timeout: ${NOTIFICATION_PROCESSING_TIMEOUT:PT10M}
    batch-size: ${NOTIFICATION_BATCH_SIZE:20}
  classification:
    batch-size: ${CLASSIFICATION_BATCH_SIZE:100}
    window-days: ${CLASSIFICATION_WINDOW_DAYS:30}
    retry-interval: ${CLASSIFICATION_RETRY_INTERVAL:PT24H}
  opendart:
    api-key: ${OPENDART_API_KEY:}
    connect-timeout: ${OPENDART_CONNECT_TIMEOUT:5s}
    read-timeout: ${OPENDART_READ_TIMEOUT:30s}
    page-size: ${OPENDART_PAGE_SIZE:100}
    max-pages: ${OPENDART_MAX_PAGES:1000}
    max-retries: ${OPENDART_MAX_RETRIES:2}
    retry-initial-delay: ${OPENDART_RETRY_INITIAL_DELAY:PT1S}
    retry-max-delay: ${OPENDART_RETRY_MAX_DELAY:PT10S}
    rate-limit-cooldown: ${OPENDART_RATE_LIMIT_COOLDOWN:PT1H}
  collection:
    enabled: ${COLLECTION_ENABLED:false}
    interval: ${COLLECTION_INTERVAL:PT10M}
    initial-delay: ${COLLECTION_INITIAL_DELAY:PT30S}
    initial-days: ${COLLECTION_INITIAL_DAYS:30}
    overlap-days: ${COLLECTION_OVERLAP_DAYS:3}

# OpenDART authenticates in the query string; never enable request URI logging.
logging:
  level:
    org.springframework.web: WARN
    org.springframework.web.client: OFF
    org.springframework.mail: OFF
    org.eclipse.angus.mail: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
