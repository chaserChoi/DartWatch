plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.dartwatch'
version = '0.0.1-SNAPSHOT'
description = 'Corporate disclosure monitoring and notification service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.1'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    systemProperty 'dartwatch.collection.enabled', 'false'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'postgres', 'live'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Starts the application and verifies a real PostgreSQL connection and HTTP endpoints.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'postgres'
        excludeTags 'live'
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('liveTest', Test) {
    description = 'Explicit opt-in: minimal real OpenDART calls; requires a configured API key and PostgreSQL.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live' }
    outputs.upToDateWhen { false }
}
